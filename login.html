<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMS Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:420px;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0px 10px 30px rgba(0,0,0,0.25);
}

.card-header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.card-header h2{
    margin:0;
    font-weight:bold;
}

.btn-login{
    width:100%;
    border-radius:10px;
}

.register-link{
    text-align:center;
    margin-top:15px;
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="card login-card">

    <div class="card-header">

        <div class="logo">
            🎓
        </div>

        <h2>LMS Login</h2>

        <p class="mb-0">
            Welcome Back
        </p>

    </div>

    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required>

            </div>

            <button
            type="submit"
            class="btn btn-primary btn-login">

            Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register Here
            </a>

        </div>

    </div>

</div>

</body>

</html>
