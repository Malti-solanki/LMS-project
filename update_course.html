<!DOCTYPE html>
<html>

<head>

<title>Update Course</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Update Course</h1>

<form method="POST">

<div class="mb-3">

<label>Course Name</label>

<input type="text"
name="course_name"
class="form-control"
value="{{course[1]}}">

</div>

<div class="mb-3">

<label>Course Duration</label>

<input type="text"
name="course_duration"
class="form-control"
value="{{course[2]}}">

</div>

<div class="mb-3">

<label>Course Fee</label>

<input type="text"
name="course_fee"
class="form-control"
value="{{course[3]}}">

</div>

<button type="submit"
class="btn btn-primary">
Update Course
</button>

</form>

</div>

</body>
</html>
