<!DOCTYPE html>
<html>

<head>

<title>Quiz Module</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand">
Quiz Module
</a>

<a href="/dashboard"
class="btn btn-light">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<h1 class="mb-4">
Online Quiz
</h1>

<form method="POST">

{% for q in questions %}

<div class="card mb-4">

<div class="card-body">

<h5>
{{q[1]}}
</h5>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="question_{{q[0]}}"
value="{{q[2]}}">

<label class="form-check-label">
{{q[2]}}
</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="question_{{q[0]}}"
value="{{q[3]}}">

<label class="form-check-label">
{{q[3]}}
</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="question_{{q[0]}}"
value="{{q[4]}}">

<label class="form-check-label">
{{q[4]}}
</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="question_{{q[0]}}"
value="{{q[5]}}">

<label class="form-check-label">
{{q[5]}}
</label>

</div>

</div>

</div>

{% endfor %}

<button
type="submit"
class="btn btn-primary">

Submit Quiz

</button>

</form>

{% if score is not none %}

<div class="alert alert-success mt-5">

<h3>
Your Score: {{score}} / {{questions|length}}
</h3>

</div>

{% endif %}

</div>

</body>
</html>
