<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Module</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    min-height:100vh;
}

.header{
    background:#0d6efd;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

.quiz-box{
    background:white;
    padding:30px;
    border-radius:20px;
    margin-top:40px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.question-card{
    margin-bottom:25px;
    padding:20px;
    border-radius:15px;
    background:#f8f9fa;
}

.option{
    margin-top:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>📝 Online Quiz Module</h1>

<p>Test Your Knowledge</p>

</div>

<div class="container">

<div class="quiz-box">

<form method="POST">

{% for q in questions %}

<div class="question-card">

<h5>
Question {{loop.index}}
</h5>

<p>
<strong>{{q[1]}}</strong>
</p>

<div class="option">

<input type="radio"
name="question_{{q[0]}}"
value="{{q[2]}}">

{{q[2]}}

</div>

<div class="option">

<input type="radio"
name="question_{{q[0]}}"
value="{{q[3]}}">

{{q[3]}}

</div>

<div class="option">

<input type="radio"
name="question_{{q[0]}}"
value="{{q[4]}}">

{{q[4]}}

</div>

<div class="option">

<input type="radio"
name="question_{{q[0]}}"
value="{{q[5]}}">

{{q[5]}}

</div>

</div>

{% endfor %}

<button
type="submit"
class="btn btn-primary w-100">

🚀 Submit Quiz

</button>

</form>

{% if score is not none %}

<div class="alert alert-success mt-4 text-center">

<h3>
🎉 Your Score: {{score}} / {{questions|length}}
</h3>

</div>

{% endif %}

<div class="text-center mt-3">

<a href="/dashboard"
class="btn btn-secondary">

🏠 Back to Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
