<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes Upload System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#4568dc,#b06ab3);
    min-height:100vh;
}

.header{
    background:#6f42c1;
    color:white;
    text-align:center;
    padding:20px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

.container-box{
    background:white;
    margin-top:40px;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.upload-section{
    background:#f8f9fa;
    padding:20px;
    border-radius:15px;
}

.btn{
    border-radius:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>📚 Notes Upload System</h1>

<p>Upload and Manage Study Materials</p>

</div>

<div class="container">

<div class="container-box">

<div class="row">

<!-- Upload Form -->

<div class="col-md-4">

<div class="upload-section">

<h3>Upload Notes</h3>

<form
method="POST"
enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">
Notes Title
</label>

<input
type="text"
name="title"
class="form-control"
placeholder="Enter Notes Title"
required>

</div>

<div class="mb-3">

<label class="form-label">
Choose File
</label>

<input
type="file"
name="file"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-primary w-100">

📤 Upload Notes

</button>

</form>

<br>

<a href="/dashboard"
class="btn btn-secondary w-100">

🏠 Back to Dashboard

</a>

</div>

</div>

<!-- Notes Table -->

<div class="col-md-8">

<h3>Uploaded Notes</h3>

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Title</th>
<th>Download</th>

</tr>

</thead>

<tbody>

{% for note in notes %}

<tr>

<td>{{note[0]}}</td>

<td>{{note[1]}}</td>

<td>

<a
href="/uploads/{{note[2]}}"
target="_blank"
class="btn btn-success btn-sm">

⬇ Download

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
