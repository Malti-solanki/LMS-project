<!DOCTYPE html>
<html>

<head>

<title>Notes Upload</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand">
Notes Upload System
</a>

<a href="/dashboard"
class="btn btn-light">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<h1 class="mb-4">
Upload Notes
</h1>

<form
method="POST"
enctype="multipart/form-data">

<div class="mb-3">

<label>Notes Title</label>

<input
type="text"
name="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Select File</label>

<input
type="file"
name="file"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-primary">

Upload Notes

</button>

</form>

<hr class="my-5">

<h2>
Uploaded Notes
</h2>

<table class="table table-bordered table-striped">

<tr class="table-dark">

<th>ID</th>
<th>Title</th>
<th>File</th>

</tr>

{% for note in notes %}

<tr>

<td>{{note[0]}}</td>

<td>{{note[1]}}</td>

<td>

<a
href="/uploads/{{note[2]}}"
target="_blank"
class="btn btn-success btn-sm">

Download

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
