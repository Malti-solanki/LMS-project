<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#11998e,#38ef7d);
    min-height:100vh;
}

.header{
    background:#198754;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

.container-box{
    background:white;
    margin-top:40px;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.form-section{
    background:#f8f9fa;
    padding:20px;
    border-radius:15px;
}

.table{
    margin-top:20px;
}

.badge{
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

<h1>📋 Attendance Management System</h1>

<p>Track Student Attendance Easily</p>

</div>

<div class="container">

<div class="container-box">

<div class="row">

<!-- Attendance Form -->

<div class="col-md-4">

<div class="form-section">

<h3>Mark Attendance</h3>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Student Name
</label>

<input
type="text"
name="student_name"
class="form-control"
placeholder="Enter Student Name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Course Name
</label>

<input
type="text"
name="course_name"
class="form-control"
placeholder="Enter Course Name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Date
</label>

<input
type="date"
name="attendance_date"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">
Attendance Status
</label>

<select
name="status"
class="form-select">

<option value="Present">
Present
</option>

<option value="Absent">
Absent
</option>

</select>

</div>

<button
type="submit"
class="btn btn-success w-100">

✅ Save Attendance

</button>

</form>

<br>

<a href="/dashboard"
class="btn btn-secondary w-100">

🏠 Back to Dashboard

</a>

</div>

</div>

<!-- Attendance Records -->

<div class="col-md-8">

<h3>Attendance Records</h3>

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Student</th>
<th>Course</th>
<th>Date</th>
<th>Status</th>

</tr>

</thead>

<tbody>

{% for a in attendance %}

<tr>

<td>{{a[0]}}</td>

<td>{{a[1]}}</td>

<td>{{a[2]}}</td>

<td>{{a[3]}}</td>

<td>

{% if a[4] == 'Present' %}

<span class="badge bg-success">
Present
</span>

{% else %}

<span class="badge bg-danger">
Absent
</span>

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
