<!DOCTYPE html>
<html>

<head>

<title>Attendance System</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand">
Attendance System
</a>

<a href="/dashboard"
class="btn btn-light">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<h1 class="mb-4">
Mark Attendance
</h1>

<form method="POST">

<div class="mb-3">

<label>Student Name</label>

<input
type="text"
name="student_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Course Name</label>

<input
type="text"
name="course_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
name="attendance_date"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-control">

<option>Present</option>

<option>Absent</option>

</select>

</div>

<button
type="submit"
class="btn btn-primary">

Save Attendance

</button>

</form>

<hr class="my-5">

<h2>
Attendance Records
</h2>

<table class="table table-bordered table-striped">

<tr class="table-dark">

<th>ID</th>
<th>Student</th>
<th>Course</th>
<th>Date</th>
<th>Status</th>

</tr>

{% for a in attendance %}

<tr>

<td>{{a[0]}}</td>
<td>{{a[1]}}</td>
<td>{{a[2]}}</td>
<td>{{a[3]}}</td>

<td>

{% if a[4] == 'Present' %}

<span class="badge bg-success">
Present
</span>

{% else %}

<span class="badge bg-danger">
Absent
</span>

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
