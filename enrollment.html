<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Enrollment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#ff9966,#ff5e62);
    min-height:100vh;
}

.header{
    background:#dc3545;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.container-box{
    background:white;
    margin-top:40px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.btn{
    border-radius:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>🎓 Student Enrollment System</h1>

<p>Enroll Students into Courses</p>

</div>

<div class="container">

<div class="container-box">

<div class="row">

<div class="col-md-5">

<h3>Enroll Student</h3>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Student Name
</label>

<input
type="text"
name="student_name"
class="form-control"
placeholder="Enter Student Name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Student Email
</label>

<input
type="email"
name="student_email"
class="form-control"
placeholder="Enter Student Email"
required>

</div>

<div class="mb-3">

<label class="form-label">
Select Course
</label>

<select
name="course_name"
class="form-select"
required>

<option value="">
Choose Course
</option>

{% for course in courses %}

<option value="{{course[1]}}">
{{course[1]}}
</option>

{% endfor %}

</select>

</div>

<button
type="submit"
class="btn btn-danger w-100">

➕ Enroll Student

</button>

</form>

<br>

<a href="/dashboard"
class="btn btn-secondary w-100">

🏠 Back to Dashboard

</a>

</div>

<div class="col-md-7">

<h3>Enrolled Students</h3>

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>

</tr>

</thead>

<tbody>

{% for student in students %}

<tr>

<td>{{student[0]}}</td>

<td>{{student[1]}}</td>

<td>{{student[2]}}</td>

<td>
<span class="badge bg-success">
{{student[3]}}
</span>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
