<!DOCTYPE html>
<html>

<head>

<title>Student Enrollment</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand">
Student Enrollment
</a>

<a href="/dashboard"
class="btn btn-light">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<h1 class="mb-4">
Enroll Student
</h1>

<form method="POST">

<div class="mb-3">

<label>Student Name</label>

<input type="text"
name="student_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Student Email</label>

<input type="email"
name="student_email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Select Course</label>

<select
name="course_name"
class="form-control">

{% for course in courses %}

<option>
{{course[1]}}
</option>

{% endfor %}

</select>

</div>

<button
type="submit"
class="btn btn-primary">

Enroll Student

</button>

</form>

<hr class="my-5">

<h2>
Enrolled Students
</h2>

<table class="table table-bordered table-striped">

<tr class="table-dark">

<th>ID</th>
<th>Student Name</th>
<th>Email</th>
<th>Course</th>

</tr>

{% for student in students %}

<tr>

<td>{{student[0]}}</td>
<td>{{student[1]}}</td>
<td>{{student[2]}}</td>
<td>{{student[3]}}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
