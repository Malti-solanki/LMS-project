<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Course</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.course-card{
    width:500px;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.card-header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.card-header h2{
    margin:0;
    font-weight:bold;
}

.btn-course{
    width:100%;
    border-radius:10px;
}

.back-btn{
    text-align:center;
    margin-top:15px;
}

.logo{
    font-size:45px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="card course-card">

    <div class="card-header">

        <div class="logo">
            📚
        </div>

        <h2>Add New Course</h2>

        <p class="mb-0">
            LMS Course Management
        </p>

    </div>

    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Course Name
                </label>

                <input
                type="text"
                name="course_name"
                class="form-control"
                placeholder="Enter Course Name"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Course Duration
                </label>

                <input
                type="text"
                name="course_duration"
                class="form-control"
                placeholder="Example: 3 Months"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Course Fee
                </label>

                <input
                type="text"
                name="course_fee"
                class="form-control"
                placeholder="Example: 5000"
                required>

            </div>

            <button
            type="submit"
            class="btn btn-primary btn-course">

            Add Course

            </button>

        </form>

        <div class="back-btn">

            <a href="/dashboard"
               class="btn btn-outline-secondary mt-3">

                Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
