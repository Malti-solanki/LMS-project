<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Courses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
}

.header{
    background:#0d6efd;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.container-box{
    background:white;
    margin-top:40px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

table{
    margin-top:20px;
}

.btn{
    border-radius:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>📚 LMS Course Management</h1>

<p>View, Update and Delete Courses</p>

</div>

<div class="container">

<div class="container-box">

<div class="d-flex justify-content-between mb-3">

<h2>Available Courses</h2>

<div>

<a href="/add_course"
class="btn btn-success">

➕ Add Course

</a>

<a href="/dashboard"
class="btn btn-secondary">

🏠 Dashboard

</a>

</div>

</div>

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Course Name</th>
<th>Duration</th>
<th>Fee</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

{% for course in courses %}

<tr>

<td>{{course[0]}}</td>

<td>{{course[1]}}</td>

<td>{{course[2]}}</td>

<td>₹ {{course[3]}}</td>

<td>

<a href="/update_course/{{course[0]}}"
class="btn btn-warning btn-sm">

✏ Update

</a>

<a href="/delete_course/{{course[0]}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Are you sure?')">

🗑 Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
