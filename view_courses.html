<!DOCTYPE html>
<html>

<head>

<title>View Courses</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand">
LMS Courses
</a>

<a href="/dashboard"
class="btn btn-light">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<h1 class="mb-4">
All Courses
</h1>

<table class="table table-bordered table-striped">

<tr class="table-dark">

<th>ID</th>
<th>Course Name</th>
<th>Duration</th>
<th>Fee</th>
<th>Actions</th>

</tr>

{% for course in courses %}

<tr>

<td>{{course[0]}}</td>

<td>{{course[1]}}</td>

<td>{{course[2]}}</td>

<td>{{course[3]}}</td>

<td>

<a href="/update_course/{{course[0]}}"
class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_course/{{course[0]}}"
class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
